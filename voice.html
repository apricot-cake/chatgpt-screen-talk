<!doctype html>
<html lang="ja">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  />
  <title>chatgpt-screen-talk</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font:
        16px/1.7 system-ui,
        sans-serif;
      background: #f5f5f3;
      color: #202522;
      margin: 0;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #f5f5f3;
      border-bottom: 1px solid #d9ddd9;
      padding: 12px 24px;
    }
    .header-row {
      max-width: 660px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    main {
      max-width: 708px;
      margin: auto;
      padding: 16px 24px 32px;
    }
    h1 {
      font-size: 18px;
      line-height: 1.3;
      margin: 0;
      white-space: nowrap;
    }
    button {
      font: inherit;
      font-size: 14px;
      padding: 7px 12px;
      border: 1px solid #777;
      border-radius: 7px;
      cursor: pointer;
      white-space: nowrap;
    }
    #start {
      background: #245441;
      color: white;
      border-color: #245441;
    }
    button:disabled {
      opacity: 0.5;
      cursor: default;
    }
    .controls {
      display: flex;
      flex-shrink: 0;
      gap: 8px;
    }
    #state {
      min-height: 2em;
    }
    #captions {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      border-top: 1px solid #ccc;
      padding-top: 16px;
      scroll-margin-top: 76px;
    }
    small {
      color: #555;
    }
    @media (max-width: 380px) {
      header {
        padding: 12px 16px;
      }
      h1 {
        font-size: 15px;
      }
      button {
        font-size: 13px;
        padding: 7px 9px;
      }
      .header-row {
        gap: 8px;
      }
      main {
        padding-inline: 16px;
      }
    }
  </style>
  <header>
    <div class="header-row">
      <h1>chatgpt-screen-talk</h1>
      <div class="controls">
        <button id="start">会話を開始</button
        ><button id="stop" disabled>終了</button>
      </div>
    </div>
  </header>
  <main>
    <p>
      マイクで質問し、音声で回答を聞きます。画面共有のタブは開いたままにしてください。共有画面の音声は取得しません。
    </p>
    <p id="state" role="status">まだ接続していません。</p>
    <audio id="reply" autoplay></audio>
    <p id="captions" aria-live="polite"></p>
    <p>
      <small
        >この会話はChatGPTログインを使う別の試験セッションです。ここでのチャット履歴は自動では引き継ぎません。会話中はマイク音声を送信し、画面についての質問に答える際は共有画像を参照します。音声での会話と共有画面の参照を確認済みです。</small
      >
    </p>
  </main>
  <script type="module" src="/src/client/voice.ts"></script>
</html>
