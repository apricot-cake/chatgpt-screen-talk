<!doctype html>
<html lang="ja">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  />
  <title>HOI4 画面共有</title>
  <style>
    body {
      font:
        16px/1.7 system-ui,
        sans-serif;
      background: #f5f5f3;
      color: #202522;
      margin: 0;
      padding: 40px 24px;
    }
    main {
      max-width: 660px;
      margin: auto;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 12px;
    }
    p {
      margin: 12px 0;
    }
    button {
      font: inherit;
      padding: 9px 20px;
      border: 1px solid #777;
      border-radius: 7px;
      cursor: pointer;
    }
    #start {
      background: #245441;
      color: white;
      border-color: #245441;
    }
    button:disabled {
      opacity: 0.5;
      cursor: default;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin: 24px 0;
    }
    video {
      width: 100%;
      max-height: 360px;
      background: #171c19;
      border-radius: 8px;
    }
    #status {
      min-height: 3em;
    }
    small {
      color: #555;
    }
  </style>
  <main>
    <h1>HOI4 画面共有</h1>
    <p>
      「共有を開始」を押し、「ウィンドウ」から Hearts of Iron IV
      を選んでください。その後はゲームに戻ってプレイできます。
    </p>
    <div class="controls">
      <button id="start">共有を開始</button
      ><button id="stop" disabled>停止</button>
    </div>
    <p id="status" role="status">共有していません。</p>
    <video id="preview" autoplay muted playsinline></video>
    <p>
      <small
        >画像はこのPC内で最新の1枚だけを更新します。画面についての質問に答える際は、共有画像をAIへ送信します。このタブを閉じると共有は止まります。</small
      >
    </p>
  </main>
  <script>
    const start = document.querySelector("#start"),
      stop = document.querySelector("#stop"),
      status = document.querySelector("#status"),
      video = document.querySelector("#preview");
    let stream,
      timer,
      busy = false,
      count = 0;
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    async function end() {
      clearInterval(timer);
      stream?.getTracks().forEach((t) => t.stop());
      stream = null;
      video.srcObject = null;
      start.disabled = false;
      stop.disabled = true;
      status.textContent = "共有を停止しました。";
      await fetch("/stop", { method: "POST" }).catch(() => {});
    }
    async function frame() {
      if (!stream || busy || video.readyState < 2) return;
      busy = true;
      try {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        const blob = await new Promise((r) =>
          canvas.toBlob(r, "image/jpeg", 0.86),
        );
        if (!blob) throw Error("画像を取得できませんでした");
        const response = await fetch("/frame", {
          method: "POST",
          headers: {
            "Content-Type": "image/jpeg",
            "X-Capture-Source":
              stream.getVideoTracks()[0].getSettings().displaySurface ||
              "unknown",
          },
          body: blob,
        });
        if (!response.ok) throw Error("画像の保存に失敗しました");
        status.textContent =
          "共有中 · " +
          ++count +
          " 枚 · " +
          new Date().toLocaleTimeString("ja-JP");
      } catch (e) {
        status.textContent = e.message;
      } finally {
        busy = false;
      }
    }
    start.addEventListener("click", async () => {
      if (!navigator.mediaDevices?.getDisplayMedia) {
        status.textContent =
          "このブラウザは画面共有に対応していません。ChromeまたはEdgeで開いてください。";
        return;
      }
      try {
        const controller =
          typeof CaptureController === "function"
            ? new CaptureController()
            : null;
        stream = await navigator.mediaDevices.getDisplayMedia({
          video: { displaySurface: "window", frameRate: { ideal: 2, max: 2 } },
          audio: false,
          ...(controller ? { controller } : {}),
        });
        try {
          controller?.setFocusBehavior("no-focus-change");
        } catch {}
        video.srcObject = stream;
        await video.play();
        stream
          .getVideoTracks()[0]
          .addEventListener("ended", end, { once: true });
        start.disabled = true;
        stop.disabled = false;
        count = 0;
        await frame();
        timer = setInterval(frame, 1000);
      } catch (e) {
        status.textContent =
          e.name === "NotAllowedError"
            ? "画面共有は開始されませんでした。"
            : e.message;
      }
    });
    stop.addEventListener("click", end);
  </script>
</html>
