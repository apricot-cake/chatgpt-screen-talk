<!doctype html>
<html lang="ja">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  />
  <title>chatgpt-screen-talk · 画面共有</title>
  <style>
    body {
      font:
        16px/1.7 system-ui,
        sans-serif;
      background: #f5f5f3;
      color: #202522;
      margin: 0;
      padding: 40px 24px;
    }
    main {
      max-width: 660px;
      margin: auto;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 12px;
    }
    p {
      margin: 12px 0;
    }
    button {
      font: inherit;
      padding: 9px 20px;
      border: 1px solid #777;
      border-radius: 7px;
      cursor: pointer;
    }
    #start {
      background: #245441;
      color: white;
      border-color: #245441;
    }
    button:disabled {
      opacity: 0.5;
      cursor: default;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin: 24px 0;
    }
    video {
      width: 100%;
      max-height: 360px;
      background: #171c19;
      border-radius: 8px;
    }
    #status {
      min-height: 3em;
    }
    small {
      color: #555;
    }
  </style>
  <main>
    <h1>chatgpt-screen-talk · 画面共有</h1>
    <p>
      「共有を開始」を押し、相談したい画面やウィンドウを選んでください。共有したまま、元のアプリで作業を続けられます。
    </p>
    <div class="controls">
      <button id="start">共有を開始</button
      ><button id="stop" disabled>停止</button>
    </div>
    <p id="status" role="status">共有していません。</p>
    <video id="preview" autoplay muted playsinline></video>
    <p>
      <small
        >画像はこのPC内で最新の1枚だけを更新します。画面についての質問に答える際は、共有画像をAIへ送信します。このタブを閉じると共有は止まります。</small
      >
    </p>
  </main>
  <script type="module" src="/src/client/screen.ts"></script>
</html>
